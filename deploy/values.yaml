# Official external-dns chart 1.23.0; replace all example scope values together.
replicaCount: 1
deploymentStrategy:
  type: Recreate
image:
  tag: v0.23.0
sources: [service, ingress]
namespaced: true
sourceNamespace: applications
labelFilter: external-dns=enabled
interval: 2m
triggerLoopOnEvent: false
policy: upsert-only
registry: txt
txtOwnerId: example-cluster
txtPrefix: "edns-%{record_type}."
domainFilters: [k8s.example.org]
managedRecordTypes: [A, AAAA, CNAME]
extraArgs:
  # These types do not require a cluster-wide Node informer.
  service-type-filter: [LoadBalancer, ExternalName]
  webhook-provider-url: http://127.0.0.1:8888
  webhook-provider-read-timeout: 120s
  webhook-provider-write-timeout: 120s
  dry-run: true
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/dnscaleou/external-dns-webhook-dnscale
      tag: v1.0.0
      pullPolicy: IfNotPresent
    env:
      # ExternalDNS does not forward its dry-run flag over the webhook protocol.
      - name: DNSCALE_DRY_RUN
        value: "true"
      - name: DNSCALE_API_TOKEN_FILE
        value: /etc/dnscale/token
      - name: DNSCALE_DOMAIN_FILTER
        value: k8s.example.org
      - name: DNSCALE_ZONE_ID_FILTER
        value: 11111111-1111-4111-8111-111111111111
      - name: DNSCALE_TXT_OWNER_ID
        value: example-cluster
    extraVolumeMounts:
      - name: dnscale-token
        mountPath: /etc/dnscale
        readOnly: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
extraVolumes:
  - name: dnscale-token
    secret:
      secretName: dnscale-api-token
      defaultMode: 0444
